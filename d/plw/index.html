<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoFile.Online</title>
  <style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a1d2e;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}

/* NAVBAR */
.navbar {
  background: #12151f;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #2a2d3e;
  position: sticky;
  top: 0;
  z-index: 99;
}
.hamburger {
  background: #3b5bdb;
  border: none;
  border-radius: 6px;
  width: 40px; height: 40px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px; cursor: pointer;
}
.hamburger span {
  display: block; width: 18px; height: 2px;
  background: #fff; border-radius: 2px;
}
.nav-brand {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}
.nav-brand em { color: #4dabf7; font-style: normal; }

/* AD SLOT */
.ad-slot {
  background: #12151f;
  border-bottom: 1px solid #2a2d3e;
  padding: 10px 14px;
  text-align: center;
}
.ad-notice {
  font-size: 12px;
  color: #888;
  margin-bottom: 8px;
}
.ad-notice a { color: #4dabf7; }
.ad-box {
  background: #0d0f1a;
  border: 1px dashed #2a2d3e;
  border-radius: 6px;
  width: 100%;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #444;
  font-size: 13px;
}

/* FOLDER INFO */
.folder-section {
  padding: 16px 14px 10px;
  border-bottom: 1px solid #2a2d3e;
}
.folder-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.folder-icon-wrap { position: relative; flex-shrink: 0; }
.folder-icon-wrap svg { width: 44px; height: 44px; color: #f5a623; }
.folder-count {
  position: absolute;
  bottom: 2px; left: 50%;
  transform: translateX(-50%);
  background: #3b5bdb;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  min-width: 18px;
  text-align: center;
}
.folder-meta { flex: 1; }
.folder-name { font-size: 17px; font-weight: 700; color: #fff; }
.folder-date { font-size: 12px; color: #888; margin-top: 2px; }
.folder-more {
  background: #23263a;
  border: 1px solid #2a2d3e;
  border-radius: 6px;
  color: #aaa;
  font-size: 16px;
  width: 36px; height: 30px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-top: 4px;
  letter-spacing: 2px;
}

/* TOOLBAR */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid #2a2d3e;
}
.chk-box {
  width: 22px; height: 22px;
  border: 2px solid #444;
  border-radius: 4px;
  background: #1a1d2e;
  cursor: pointer;
  flex-shrink: 0;
}
.toolbar-spacer { flex: 1; }
.tool-btn {
  background: #23263a;
  border: 1px solid #2a2d3e;
  border-radius: 6px;
  color: #ccc;
  width: 38px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.15s;
}
.tool-btn:hover { background: #2d3150; }
.tool-btn-upload {
  background: #2f9e44;
  border-color: #2f9e44;
  color: #fff;
  width: 38px; height: 34px;
}
.tool-btn-upload:hover { background: #27852f; }

/* FILE CARD */
.file-card {
  border-bottom: 1px solid #2a2d3e;
  padding: 14px 14px 0;
}
.file-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}
.file-chk {
  width: 20px; height: 20px;
  border: 2px solid #444;
  border-radius: 3px;
  background: #1a1d2e;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
}
.file-info { flex: 1; min-width: 0; }
.file-name {
  font-size: 14px;
  font-weight: 600;
  color: #e0e0e0;
  word-break: break-all;
  line-height: 1.4;
}
.file-size { font-size: 12px; color: #888; }

/* THUMBNAIL */
.thumb-wrap {
  margin: 0 -0px 0 32px;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  position: relative;
  max-width: 320px;
}
.thumb-wrap video {
  width: 100%;
  display: block;
}

/* FILE ACTIONS */
.file-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding: 10px 0 14px;
}
.btn-play {
  width: 42px; height: 42px;
  border-radius: 8px;
  background: #23263a;
  border: 1px solid #3a3d55;
  color: #e0e0e0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
}
.btn-play:hover { background: #2d3150; }
.btn-download {
  width: 42px; height: 42px;
  border-radius: 8px;
  background: #23263a;
  border: 1px solid #3a3d55;
  color: #e0e0e0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  text-decoration: none;
  font-size: 18px;
}
.btn-download:hover { background: #2d3150; }
.btn-more {
  width: 42px; height: 42px;
  border-radius: 8px;
  background: #23263a;
  border: 1px solid #3a3d55;
  color: #e0e0e0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 20px;
  letter-spacing: 1px;
  line-height: 1;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 24px 16px;
  color: #555;
  font-size: 12px;
  margin-top: 10px;
}
footer strong { color: #4dabf7; }

/* DOWNLOAD MODAL */
.modal-bg {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #12151f;
  border: 1px solid #2a2d3e;
  border-radius: 12px;
  padding: 22px 22px 20px;
  width: 88%; max-width: 360px;
  position: relative;
}
.modal-x {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none;
  color: #666; font-size: 20px; cursor: pointer;
  line-height: 1;
}
.modal-x:hover { color: #ccc; }
.modal h3 {
  font-size: 15px; margin-bottom: 6px;
  color: #fff; display: flex; align-items: center; gap: 8px;
}
.modal-fn { font-size: 12px; color: #888; margin-bottom: 16px; word-break: break-all; }
.dl-track { width: 100%; height: 5px; background: #23263a; border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.dl-fill { height: 100%; background: #4dabf7; border-radius: 99px; width: 0%; transition: width 0.07s linear; }
.dl-row { display: flex; justify-content: space-between; font-size: 13px; }
.dl-pct { color: #fff; font-weight: 700; }
.dl-spd { color: #51cf66; }
</style>
 </head>

  <script>
    var dlIv;
    function showDL(name) {

      document.getElementById('dlModal').classList.add('open');

        if(p >= 100){ p = 100; clearInterval(dlIv); document.getElementById('dlSpd').textContent = 'Done ✓'; setTimeout(closeDL, 1200); }
