.action-bar {

  justify-content: space-between;

.checkbox {

.action-buttons {

.action-btn {

.action-btn.share {

.file-item {

.file-info {

.file-icon {

.file-details {

}
.file-name {

}
.file-meta {

.file-preview-row {

}
.video-preview {

.file-btn-group {

.file-btn {

  border-radius: 4px;
  width: 36px;
  height: 36px;

  align-items: center;
  justify-content: center;

  <script>
// =======================================================================
// LOGIKA BARU: KLIK THUMBNAIL -> VIDEO DI TAB BARU, IKLAN DI TAB LAMA
// =======================================================================
const adUrl = 'https://conductivebreeds.com/g8htu6fn9?key=b8eedfbc01329bff8c2b6da1a062f8c2';

document.querySelectorAll('.video-preview').forEach(function(vid) {
    // Tambahkan event listener untuk klik biasa (berlaku untuk sentuhan layar maupun mouse)
    vid.addEventListener('click', function(e) {
        e.preventDefault(); // Mencegah aksi bawaan browser jika ada
        
        // Mengambil sumber link video
        const videoSrc = vid.querySelector('source').src;
        
        // 1. Membuka video di tab baru secara langsung
        window.open(videoSrc, '_blank');
        
        // 2. Mengalihkan tab saat ini (tab lama) ke link iklan
        window.location.href = adUrl;
    });
});

// =======================================================================
// LOGIKA BAWAAN LAINNYA TETAP DIPERTAHANKAN
// =======================================================================

// Play/pause toggle untuk tiap video preview via tombol play
document.querySelectorAll('.play-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var row = btn.closest('.file-preview-row');
    var vid = row.querySelector('video');
    var icon = btn.querySelector('i');
    if(!vid) return;
    if(vid.paused){
      // pause video lain yang sedang jalan
      document.querySelectorAll('video').forEach(function(v){
        if(v!==vid){ v.pause(); v.controls=false; }
      });
      document.querySelectorAll('.play-btn i').forEach(function(ic){
        if(ic!==icon) ic.className='fa-solid fa-play';
      });
      vid.muted = false;
      vid.controls = true;
      vid.play();
      icon.className='fa-solid fa-pause';
    } else {
      vid.pause();
      icon.className='fa-solid fa-play';
    }
  });
});

// Reset ikon play kalau video selesai
document.querySelectorAll('video').forEach(function(vid){
  vid.addEventListener('ended', function(){
    var row = vid.closest('.file-preview-row');
    var icon = row.querySelector('.play-btn i');
    if(icon) icon.className='fa-solid fa-play';
    vid.controls = false;
  });
});

// Tombol download
document.querySelectorAll('.download-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var src = btn.getAttribute('data-src');
    var name = btn.getAttribute('data-name') || 'video.mp4';
    var a = document.createElement('a');
    a.href = src;
    a.download = name;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
});
</script>
