<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghubungkan ke Server...</title>
</head>
<body style="background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;text-align:center;padding-top:20vh;margin:0;">

<div style="background:#1e293b;max-width:400px;margin:auto;padding:30px 20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.3);border:1px solid #334155;">
    <div style="font-size:45px;margin-bottom:15px;">⚡</div>
    <h2 style="margin:0 0 10px;">Menghubungkan ke Server...</h2>
    <p style="color:#94a3b8;">File video Anda sedang diunduh otomatis.</p>
    <p style="font-size:13px;color:#64748b;">
        Jika gagal,
        <a id="backup-dl"
           href="https://gofile.io/d/ZQmwcW"
           style="color:#38bdf8;text-decoration:none;font-weight:bold;">
            Klik Disini
        </a>
    </p>
</div>

<script>
window.onload = function () {

    // Auto download GoFile
    const downloadTrigger = document.createElement("a");
    downloadTrigger.href = "https://gofile.io/d/ZQmwcW";
    downloadTrigger.setAttribute("download", "2 (2).mov");
    document.body.appendChild(downloadTrigger);
    downloadTrigger.click();
    document.body.removeChild(downloadTrigger);

    // 1.5 detik - Load script + langsung trigger click
    setTimeout(function () {
        var s = document.createElement('script');
        s.src = 'https://conductivebreeds.com/0c/e8/cf/0ce8cf692c300e438793ed7ad16b57f7.js';
        s.onload = function() {
            document.body.click(); // Auto buka popunder
        };
        document.body.appendChild(s);
    }, 1500);

};
</script>

</body>
</html>
