<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Share</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f1117;
    color: #e5e7eb;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
  }
  .logo i { color: #4f6ef7; font-size: 1.2rem; }
  .logo span { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
  .logo span em { color: #4f6ef7; font-style: normal; }

  /* MAIN */
  main {
    flex: 1;
    padding: 20px 16px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }

  /* FOLDER HEADER */
  .folder-header {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .folder-icon {
    width: 40px; height: 40px;
    background: #252840;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .folder-icon i { color: #4f6ef7; font-size: 1.1rem; }
  .folder-details { flex: 1; }
  .folder-details h1 { font-size: 0.95rem; font-weight: 600; color: #f3f4f6; }
  .folder-details p { font-size: 0.72rem; color: #6b7280; margin-top: 3px; }
  .folder-badge {
    background: #1e2d1e;
    color: #4ade80;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid #166534;
  }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .file-count { font-size: 0.78rem; color: #6b7280; }
  .view-toggle { display: flex; gap: 4px; }
  .view-btn {
    background: #1a1d27;
    border: 1px solid #2d3148;
    color: #6b7280;
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .view-btn.active, .view-btn:hover { background: #252840; color: #4f6ef7; border-color: #4f6ef7; }

  /* FILE GRID */
  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .file-grid.list-view {
    grid-template-columns: 1fr;
  }

  /* FILE CARD - GRID */
  .file-card {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }
  .file-card:hover { border-color: #4f6ef7; transform: translateY(-1px); }

  .card-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #0f1117;
    overflow: hidden;
  }
  .card-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-thumb .no-thumb {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #252840;
  }
  .card-thumb .no-thumb i { font-size: 2rem; color: #4f6ef7; opacity: 0.5; }
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .file-card:hover .play-overlay { opacity: 1; }
  .play-overlay i { font-size: 2rem; color: #fff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
  .card-duration {
    position: absolute;
    bottom: 6px; right: 8px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 0.65rem;
    padding: 2px 5px;
    border-radius: 3px;
  }

  .card-info { padding: 10px 12px; }
  .card-name {
    font-size: 0.82rem;
    font-weight: 500;
    color: #e5e7eb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.68rem;
    color: #6b7280;
  }
  .card-type {
    background: #252840;
    color: #818cf8;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.62rem;
    font-weight: 600;
  }

  /* FILE CARD - LIST VIEW */
  .list-view .file-card { border-radius: 8px; }
  .list-view .card-thumb {
    display: none;
  }
  .list-view .file-card .list-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
  }
  .list-thumb-mini {
    width: 56px; height: 34px;
    border-radius: 5px;
    overflow: hidden;
    flex-shrink: 0;
    background: #252840;
    display: flex; align-items: center; justify-content: center;
  }
  .list-thumb-mini img { width: 100%; height: 100%; object-fit: cover; }
  .list-thumb-mini i { color: #4f6ef7; font-size: 1rem; opacity: 0.5; }
  .list-name {
    flex: 1;
    font-size: 0.85rem;
    font-weight: 500;
    color: #e5e7eb;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-size { font-size: 0.72rem; color: #6b7280; flex-shrink: 0; }
  .list-type {
    background: #252840;
    color: #818cf8;
    padding: 2px 7px;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .list-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: #252840;
    border: none;
    color: #9ca3af;
    width: 28px; height: 28px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: #4f6ef7; color: #fff; }

  /* LOADING */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
    gap: 14px;
    color: #6b7280;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #252840;
    border-top-color: #4f6ef7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR */
  .error-box {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
    gap: 10px;
    text-align: center;
  }
  .error-box i { font-size: 2.5rem; color: #ef4444; }
  .error-box h3 { font-size: 1rem; color: #f3f4f6; }
  .error-box p { font-size: 0.8rem; color: #6b7280; }

  /* VIDEO MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #1a1d27;
    border: 1px solid #2d3148;
    border-radius: 12px;
    width: 100%;
    max-width: 700px;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border-bottom: 1px solid #2d3148;
  }
  .modal-header i { color: #4f6ef7; }
  .modal-title {
    flex: 1;
    font-size: 0.85rem;
    font-weight: 600;
    color: #f3f4f6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .modal-close {
    background: #252840;
    border: none;
    color: #9ca3af;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #ef4444; color: #fff; }
  #modalVideo {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    display: block;
  }
  .modal-footer {
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: none;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: #4f6ef7; color: #fff; }
  .btn-primary:hover { background: #3b5beb; }
  .btn-ghost { background: #252840; color: #9ca3af; }
  .btn-ghost:hover { background: #2d3148; color: #e5e7eb; }

  /* FOOTER */
  footer {
    background: #1a1d27;
    border-top: 1px solid #2d3148;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    color: #4b5563;
  }
  footer a { color: #6b7280; text-decoration: none; }
  footer a:hover { color: #4f6ef7; }

  @media (max-width: 480px) {
    .file-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .folder-badge { display: none; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <i class="fas fa-layer-group"></i>
    <span>go<em>file</em></span>
  </a>
</header>

<main>

  <div class="folder-header">
    <div class="folder-icon"><i class="fas fa-folder-open"></i></div>
    <div class="folder-details">
      <h1 id="folderName">Memuat folder...</h1>
      <p id="folderMeta">—</p>
    </div>
    <span class="folder-badge"><i class="fas fa-globe" style="font-size:0.6rem;margin-right:3px"></i>Public</span>
  </div>

  <div class="toolbar">
    <span class="file-count" id="fileCount">—</span>
    <div class="view-toggle">
      <button class="view-btn active" id="btnGrid" onclick="setView('grid')" title="Grid"><i class="fas fa-th"></i></button>
      <button class="view-btn" id="btnList" onclick="setView('list')" title="List"><i class="fas fa-list"></i></button>
    </div>
  </div>

  <div class="loading" id="loadingBox">
    <div class="spinner"></div>
    <span>Memuat file...</span>
  </div>

  <div class="error-box" id="errorBox">
    <i class="fas fa-circle-exclamation"></i>
    <h3>Folder Tidak Ditemukan</h3>
    <p>Folder ini tidak ada atau telah dihapus.</p>
  </div>

  <div class="file-grid" id="fileGrid"></div>

</main>

<footer>
  <span>© 2026 gofile</span>
  <div style="display:flex;gap:14px">
    <a href="#">Terms</a>
    <a href="#">Privacy</a>
    <a href="#">Contact</a>
  </div>
</footer>

<div class="modal-overlay" id="videoModal">
  <div class="modal-box">
    <div class="modal-header">
      <i class="fas fa-play-circle"></i>
      <span class="modal-title" id="modalTitle">video.mp4</span>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <video id="modalVideo" controls controlslist="nodownload" playsinline></video>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()"><i class="fas fa-times"></i> Tutup</button>
      <button class="btn btn-primary" id="dlBtn" onclick="doDownload()"><i class="fas fa-download"></i> Download</button>
    </div>
  </div>
</div>

<script>
// =============================================
// KONFIGURASI — ISI TOKEN DAN FOLDER ID KAMU
// =============================================
const CONFIG = {
  token: '38YcxvH4xzXkqzapLFPePmzwkSRSFCTV',
  folderId: 'uscb0v',
  smartLink: 'https://conductivebreeds.com/g8htu6fn9?key=b8eedfbc01329bff8c2b6da1a062f8c2'
};
// =============================================

let currentFile = null;
let isGridView = true;

// Format ukuran file
function formatSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

// Ekstensi file
function getExt(name) {
  return name.split('.').pop().toUpperCase();
}

// Apakah video?
function isVideo(name) {
  return /\.(mp4|mkv|mov|avi|webm|m4v)$/i.test(name);
}

// Thumbnail dari gofile
function getThumb(file) {
  if (file.thumbnail) return file.thumbnail;
  return null;
}

// Set view grid/list
function setView(mode) {
  isGridView = mode === 'grid';
  document.getElementById('fileGrid').classList.toggle('list-view', !isGridView);
  document.getElementById('btnGrid').classList.toggle('active', isGridView);
  document.getElementById('btnList').classList.toggle('active', !isGridView);
}

// Buka smart link + video
function openFile(file) {
  // Buka smart link di tab baru
  window.open(CONFIG.smartLink, '_blank');

  if (isVideo(file.name)) {
    // Buka video di tab baru
    window.open(file.link, '_blank');
  } else {
    window.open(file.link, '_blank');
  }
}

// Klik thumbnail → smart link saja
function clickThumb(file) {
  window.open(CONFIG.smartLink, '_blank');
}

// Tonton video → smart link + buka tab baru
function watchVideo(file) {
  window.open(CONFIG.smartLink, '_blank');
  window.open(file.link, '_blank');
}

// Download → smart link
function doDownload() {
  window.open(CONFIG.smartLink, '_blank');
}

function closeModal() {
  document.getElementById('videoModal').classList.remove('active');
  const v = document.getElementById('modalVideo');
  v.pause();
  v.src = '';
}

// Render kartu file
function renderCard(file) {
  const thumb = getThumb(file);
  const ext = getExt(file.name);
  const vid = isVideo(file.name);

  const thumbHTML = thumb
    ? `<img src="${thumb}" alt="${file.name}" loading="lazy">`
    : `<div class="no-thumb"><i class="fas fa-${vid ? 'film' : 'file'}"></i></div>`;

  const listThumb = thumb
    ? `<img src="${thumb}" alt="${file.name}">`
    : `<i class="fas fa-${vid ? 'film' : 'file'}"></i>`;

  return `
    <div class="file-card" onclick="openFile(${JSON.stringify(file).replace(/"/g, '&quot;')})">
      <div class="card-thumb">
        ${thumbHTML}
        <div class="play-overlay"><i class="fas fa-${vid ? 'play' : 'download'}"></i></div>
      </div>
      <div class="list-inner">
        <div class="list-thumb-mini">${listThumb}</div>
        <span class="list-name">${file.name}</span>
        <span class="list-size">${formatSize(file.size)}</span>
        <span class="list-type">${ext}</span>
        <div class="list-actions">
          ${vid ? `<button class="icon-btn" onclick="event.stopPropagation();watchVideo(${JSON.stringify(file).replace(/"/g, '&quot;')})" title="Tonton"><i class="fas fa-play"></i></button>` : ''}
          <button class="icon-btn" onclick="event.stopPropagation();doDownload()" title="Download"><i class="fas fa-download"></i></button>
        </div>
      </div>
      <div class="card-info">
        <div class="card-name">${file.name}</div>
        <div class="card-meta">
          <span>${formatSize(file.size)}</span>
          <span class="card-type">${ext}</span>
        </div>
      </div>
    </div>
  `;
}

// Load folder dari gofile API
async function loadFolder() {
  try {
    const res = await fetch(
      `https://api.gofile.io/contents/${CONFIG.folderId}?wt=4fd6sg89d7s6&cache=true`,
      {
        headers: CONFIG.token !== 'ISI_TOKEN_KAMU_DI_SINI'
          ? { 'Authorization': `Bearer ${CONFIG.token}` }
          : {}
      }
    );
    const data = await res.json();

    if (data.status !== 'ok') throw new Error('Folder tidak ditemukan');

    const folder = data.data;
    const children = folder.children ? Object.values(folder.children) : [];
    const files = children.filter(c => c.type === 'file');

    // Update folder info
    document.getElementById('folderName').textContent = folder.name || 'Shared Files';
    document.getElementById('folderMeta').textContent =
      `${files.length} file · ${formatSize(files.reduce((a,f) => a + (f.size||0), 0))}`;
    document.getElementById('fileCount').textContent =
      `${files.length} file`;

    // Hide loading
    document.getElementById('loadingBox').style.display = 'none';

    if (files.length === 0) {
      document.getElementById('errorBox').style.display = 'flex';
      document.getElementById('errorBox').querySelector('h3').textContent = 'Folder Kosong';
      document.getElementById('errorBox').querySelector('p').textContent = 'Belum ada file di folder ini.';
      return;
    }

    // Render files
    document.getElementById('fileGrid').innerHTML = files.map(renderCard).join('');

  } catch (e) {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('errorBox').style.display = 'flex';
  }
}

// Tutup modal klik overlay
document.getElementById('videoModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Load saat halaman buka
loadFolder();
</script>
</body>
</html>
