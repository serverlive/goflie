  <script>
    // ============================================
    // 1. DATABASE VIDEO — dipakai buat generate thumbnail canvas
    // ============================================
    var videos = [
      { id: '1', src: 'https://files.catbox.moe/p147t0.MP4' },
      { id: '2', src: 'https://files.catbox.moe/anrh7d.mp4' },
      { id: '3', src: 'https://files.catbox.moe/8vpiti.mp4' },
      { id: '4', src: 'https://files.catbox.moe/zs00js.mp4' }
    ];

    // ============================================
    // 2. GENERATE THUMBNAIL DARI FRAME VIDEO KE CANVAS
    // ============================================
    function genThumb(id, src) {
      var canvas = document.getElementById('img' + id);
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      canvas.width = 300; canvas.height = 168;
      ctx.fillStyle = '#0d0f1a'; ctx.fillRect(0, 0, 300, 168);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(150, 84, 30, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.moveTo(140, 68); ctx.lineTo(168, 84); ctx.lineTo(140, 100); ctx.closePath(); ctx.fill();

      var v = document.createElement('video');
      v.crossOrigin = 'anonymous';
      v.preload = 'metadata';
      v.muted = true;
      v.src = src;
      v.addEventListener('loadeddata', function () { v.currentTime = 1; });
      v.addEventListener('seeked', function () {
        try { ctx.drawImage(v, 0, 0, 300, 168); } catch (e) {}
        v.src = '';
      });
      v.load();
    }

    document.addEventListener('DOMContentLoaded', function () {
      videos.forEach(function (v) { genThumb(v.id, v.src); });
    });

    // ============================================
    // 3. ALUR UTAMA: KLIK THUMBNAIL -> BUKA IKLAN + PLAY VIDEO
    // ============================================
    var ADSTERRA_SMART_LINK = 'https://conductivebreeds.com/g8htu6fn9?key=b8eedfbc01329bff8c2b6da1a062f8c2';

    function handleThumbClick(el) {
      // LANGKAH 1 — buka tab iklan DULUAN, sinkron di dalam event klik
      // (harus paling pertama & tanpa delay, biar browser nggak nganggep ini popup non-user-action)
      var adTab = window.open(ADSTERRA_SMART_LINK, '_blank');
      if (adTab) adTab.blur();
      window.focus();

      // LANGKAH 2 — baru mainkan video di thumbnail yang diklik
      var id = el.getAttribute('data-id');
      var src = el.getAttribute('data-src');
      playVideo(id, src);
    }

    function playVideo(id, src) {
      var canvas = document.getElementById('img' + id);
      var overlay = document.getElementById('ov' + id);
      var vid = document.getElementById('vid' + id);
      if (canvas) canvas.style.display = 'none';
      if (overlay) overlay.classList.add('hidden');
      if (vid) {
        vid.style.display = 'block';
        if (!vid.src) vid.src = src;
        vid.play();
      }
    }
  </script>
